openapi: 3.0.3
info:
  title: Fluxus Connect — API pubblica
  version: "0.6.0"
  description: |
    API pubblica di Fluxus Connect, per sistemi esterni — console di
    regia, software di scaletta — che vogliono seguire o inviare
    istruzioni a una registrazione Fluxus senza mai raggiungere
    direttamente il Pi, che resta in rete privata.

    Documenta solo ciò che esiste ed è collaudato oggi: lettura dello
    stato (`follow`), lettura dei cataloghi pubblicati dal Pi (storico
    registrazioni, marker/cue, sorgenti, orari programmati — stesso
    scope `follow`) e deposito di un comando marker/cue (`controllo`).
    Avvio/stop registrazione da remoto **non** sono previsti in questa
    versione dell'API — restano PENDING/FUTURO.

    Fluxus può registrare da più sorgenti contemporaneamente: `registrations`
    in `FollowStatus` elenca tutte le registrazioni attive, e `target_id`
    in `CommandRequest` indica a quale delle registrazioni elencate si
    applica un comando — obbligatorio quando più di una è attiva. La
    scelta del bersaglio spetta sempre a chi chiama, mai a un'euristica di
    Connect o del Pi. Vedi `docs/NOTE-TECNICHE.md`, "Follow
    multi-registrazione" e "Comando con bersaglio esplicito", per il
    perché di questa forma additiva (nessuna `/api/v2/` necessaria: i
    campi in cima a `FollowStatus` restano compatibili con chi ha
    integrato prima di questa estensione).

    Non documenta l'API riservata al Pi (`/api/pi/...`, Fase 3): quella
    si autentica col token di primo livello del Pi, mai con una
    sotto-chiave, e non è pensata per essere consumata da terzi.
  contact:
    name: Fluxus Connect
servers:
  - url: /api/v1
    description: >-
      Radice dell'API pubblica, relativa al dominio su cui è installata
      questa istanza di Fluxus Connect. Un'incompatibilità futura aprirà
      una /api/v2/ separata, invece di rompere silenziosamente le
      integrazioni esistenti.
tags:
  - name: follow
    description: Lettura dello stato pubblicato dal Pi (sola lettura).
  - name: control
    description: Deposito di comandi nella coda che il Pi ritira al polling successivo.
paths:
  /follow/status.php:
    get:
      operationId: getFollowStatus
      tags: [follow]
      summary: Legge l'ultimo stato pubblicato dal Pi
      description: |
        Restituisce lo specchio di sola lettura dell'ultimo stato che il
        Pi ha pubblicato (via la sua API riservata, non esposta qui).
        Se il Pi non ha ancora pubblicato nulla, `state` vale `"unknown"`
        e nessun altro campo oltre a `node_name` e `registrations`
        (vuoto) è presente.

        `registrations` elenca tutte le registrazioni attualmente attive
        — Fluxus può registrare da più sorgenti insieme. I campi in cima
        alla risposta (`state`, `id`, `source`, `media_type`,
        `started_at`, `elapsed_seconds`, `marker_count`) restano per
        compatibilità con chi ha integrato questo endpoint prima che
        esistesse `registrations`: rispecchiano la prima registrazione
        dell'elenco così come pubblicata dal Pi, non una scelta di
        Connect su quale sia "la" registrazione che conta. Con più di una
        registrazione attiva quello specchio in cima non basta più a
        rappresentare la situazione per intero — usare `registrations`
        per vederle tutte, o per scegliere il `target_id` di un comando.

        Whitelist in lettura applicata anche qui, in aggiunta a quella
        già imposta in scrittura dall'API riservata al Pi (difesa in
        profondità): campi come percorsi filesystem, PID, note interne o
        configurazione delle sorgenti non vengono mai restituiti, anche
        se per errore finissero su disco.
      security:
        - subkeyAuth: []
      responses:
        "200":
          description: Stato letto con successo (anche se `state` è `"unknown"`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowStatus"
              examples:
                unaRegistrazione:
                  summary: Una sola registrazione in corso
                  value:
                    node_name: "Pi di test"
                    state: "in registrazione"
                    id: "rec-a1b2c3"
                    source: "ingresso-1"
                    media_type: "video"
                    started_at: "2026-08-04T10:00:00Z"
                    elapsed_seconds: 42
                    marker_count: 3
                    received_at: "2026-08-04T10:00:42.000000Z"
                    registrations:
                      - id: "rec-a1b2c3"
                        state: "in registrazione"
                        source: "ingresso-1"
                        media_type: "video"
                        started_at: "2026-08-04T10:00:00Z"
                        elapsed_seconds: 42
                        marker_count: 3
                pluriRegistrazione:
                  summary: Più registrazioni attive contemporaneamente
                  value:
                    node_name: "Pi di test"
                    state: "in registrazione"
                    id: "rec-a1b2c3"
                    source: "ingresso-1"
                    media_type: "video"
                    started_at: "2026-08-04T10:00:00Z"
                    elapsed_seconds: 42
                    marker_count: 3
                    received_at: "2026-08-04T10:00:42.000000Z"
                    registrations:
                      - id: "rec-a1b2c3"
                        state: "in registrazione"
                        source: "ingresso-1"
                        media_type: "video"
                        started_at: "2026-08-04T10:00:00Z"
                        elapsed_seconds: 42
                        marker_count: 3
                      - id: "rec-d4e5f6"
                        state: "in registrazione"
                        source: "ingresso-2"
                        media_type: "audio"
                        started_at: "2026-08-04T10:05:00Z"
                        elapsed_seconds: 12
                        marker_count: 0
                nessunoStatoPubblicato:
                  summary: Nessuno stato ancora pubblicato dal Pi
                  value:
                    node_name: "Pi di test"
                    state: "unknown"
                    registrations: []
        "401":
          description: >-
            Sotto-chiave mancante, malformata, inesistente o revocata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                mancante:
                  value:
                    error: "sotto-chiave mancante o malformata (atteso: Authorization: Bearer <sotto-chiave>)"
                nonValida:
                  value:
                    error: "sotto-chiave non valida"
                revocata:
                  value:
                    error: "sotto-chiave revocata"
        "405":
          description: Metodo diverso da GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "metodo non consentito, atteso GET"
  /control/commands.php:
    post:
      operationId: postControlCommand
      tags: [control]
      summary: Deposita un comando (marker o cue) nella coda del Pi
      description: |
        Deposita un comando nella coda del tenant autenticato dalla
        sotto-chiave. Il Pi la ritira al giro di polling successivo
        (Fase 6, non ancora costruita) e la conferma tramite la propria
        API riservata — questo endpoint non attende né garantisce
        l'esecuzione, solo il deposito in coda.

        Whitelist stretta sul campo `type`: solo `marker` e `cue`.
        Avvio/stop registrazione restano PENDING/FUTURO per il raggio di
        danno più alto di un comando in ritardo di polling — vedi
        `docs/NOTE-TECNICHE.md`.

        Richiede lo scope `follow+control`: una sotto-chiave con solo
        `follow` viene rifiutata con 403.

        Se più di una registrazione è attiva contemporaneamente (vedi
        `registrations` in `GET /follow/status.php`), `target_id` è
        **obbligatorio** e deve corrispondere a una di quelle
        registrazioni — un valore che non è fra quelle correntemente
        attive viene rifiutato con 400, stessa whitelist stretta già
        applicata a `type`. Con una sola registrazione attiva `target_id`
        è facoltativo: Connect lo assegna da sé a quell'unica
        registrazione (non è un'euristica, è l'unica scelta possibile).
        Con nessuna registrazione attiva il comando viene comunque
        accettato, senza bersaglio.
      security:
        - subkeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandRequest"
            examples:
              marker:
                summary: Marker con etichetta (nessuna o una sola registrazione attiva)
                value:
                  type: "marker"
                  label: "Ingresso ospite"
              cue:
                summary: Cue senza etichetta
                value:
                  type: "cue"
              markerConBersaglio:
                summary: Marker verso una registrazione precisa (più di una attiva)
                value:
                  type: "marker"
                  label: "Ingresso ospite"
                  target_id: "rec-a1b2c3"
      responses:
        "200":
          description: Comando accodato con successo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
              example:
                ok: true
                id: "20260804T210000.000000Z-a1b2c3d4"
        "400":
          description: >-
            Corpo della richiesta mancante, non JSON, `type`/`label` non
            validi (`type` deve essere `marker` o `cue`; `label`, se
            presente, deve essere una stringa di al più 500 caratteri),
            oppure `target_id` mancante (con più registrazioni attive) o
            non fra quelle correntemente attive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                corpoVuoto:
                  value:
                    error: "corpo della richiesta mancante o vuoto"
                corpoNonJson:
                  value:
                    error: "corpo della richiesta non è un oggetto JSON valido"
                typeMancanteOInvalido:
                  value:
                    error: "campo 'type' obbligatorio: ammessi solo marker, cue"
                labelNonStringa:
                  value:
                    error: "campo 'label' deve essere una stringa"
                labelTroppoLunga:
                  value:
                    error: "campo 'label' troppo lungo (massimo 500 caratteri)"
                targetIdMancante:
                  summary: target_id omesso con più registrazioni attive
                  value:
                    error: "campo 'target_id' obbligatorio: più di una registrazione è attualmente attiva (rec-a1b2c3, rec-d4e5f6)"
                targetIdNonValido:
                  summary: target_id fuori whitelist
                  value:
                    error: "campo 'target_id' non valido: registrazioni attive: rec-a1b2c3, rec-d4e5f6"
        "401":
          description: Sotto-chiave mancante, malformata, inesistente o revocata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                mancante:
                  value:
                    error: "sotto-chiave mancante o malformata (atteso: Authorization: Bearer <sotto-chiave>)"
                nonValida:
                  value:
                    error: "sotto-chiave non valida"
                revocata:
                  value:
                    error: "sotto-chiave revocata"
        "403":
          description: >-
            Sotto-chiave valida ma con scope `follow` soltanto — il
            controllo richiede `follow+control`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "sotto-chiave senza i permessi necessari per questa richiesta"
        "405":
          description: Metodo diverso da POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "metodo non consentito, atteso POST"
  /follow/recordings.php:
    get:
      operationId: getFollowRecordings
      tags: [follow]
      summary: Elenco delle registrazioni, o dettaglio di una singola con ?id=
      description: |
        Specchio di sola lettura dello storico registrazioni pubblicato
        dal Pi (via la sua API riservata, non esposta qui). Nessun
        instradamento dinamico nel progetto: il dettaglio di una singola
        registrazione passa dal parametro di query `id`, non da un
        segmento di percorso — `404` se non corrisponde a nessuna
        registrazione nota a questo tenant.

        Senza `id`, restituisce l'elenco completo, filtrabile con
        `media_type`, `source_id`, `status` (combinabili fra loro).

        Whitelist in lettura applicata anche qui, in aggiunta a quella
        già imposta in scrittura dall'API riservata al Pi (difesa in
        profondità).
      security:
        - subkeyAuth: []
      parameters:
        - name: id
          in: query
          required: false
          description: >-
            Se presente, restituisce il dettaglio di questa sola
            registrazione invece dell'elenco; ignora gli altri filtri.
          schema:
            type: string
        - name: media_type
          in: query
          required: false
          schema:
            type: string
            enum: [audio, video, clock]
        - name: source_id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [recording, completed, failed]
      responses:
        "200":
          description: >-
            Elenco (eventualmente filtrato) senza `id`, dettaglio della
            singola registrazione con `id`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RecordingsList"
                  - $ref: "#/components/schemas/Recording"
              examples:
                elenco:
                  summary: Elenco senza filtri
                  value:
                    recordings:
                      - id: "rec-a1b2c3"
                        source_id: "src-1"
                        source_name: "Ingresso 1"
                        media_type: "video"
                        status: "completed"
                        start_time: "2026-08-04T10:00:00Z"
                        end_time: "2026-08-04T10:42:00Z"
                        duration_seconds: 2520
                        marker_count: 3
                        clip_count: 1
                dettaglio:
                  summary: Dettaglio con ?id=rec-a1b2c3
                  value:
                    id: "rec-a1b2c3"
                    source_id: "src-1"
                    source_name: "Ingresso 1"
                    media_type: "video"
                    status: "completed"
                    start_time: "2026-08-04T10:00:00Z"
                    end_time: "2026-08-04T10:42:00Z"
                    duration_seconds: 2520
                    marker_count: 3
                    clip_count: 1
        "400":
          description: Parametro di query non valido (`id` vuoto, o `media_type`/`status` fuori enum).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sotto-chiave mancante, malformata, inesistente o revocata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`id` richiesto ma non corrisponde a nessuna registrazione nota."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "nessuna registrazione nota con id: rec-a1b2c3"
        "405":
          description: Metodo diverso da GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /follow/recordings_markers.php:
    get:
      operationId: getFollowRecordingMarkers
      tags: [follow]
      summary: Marker/cue di una registrazione
      description: |
        Specchio di sola lettura di quanto pubblicato dal Pi via la sua
        API riservata per marker/cue. Parametro di query `id`
        obbligatorio (id della registrazione, non un segmento di
        percorso — stesso motivo di `/follow/recordings.php`). Nessuna
        verifica che `id` corrisponda a una registrazione nota: un
        marker con un `recording_id` "orfano" è innocuo, quindi si
        applica solo il filtro, mai un `404` sull'id della registrazione.
        Filtro opzionale aggiuntivo: `type`.
      security:
        - subkeyAuth: []
      parameters:
        - name: id
          in: query
          required: true
          description: Id della registrazione di cui elencare i marker/cue.
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [marker, cue]
      responses:
        "200":
          description: Elenco (eventualmente vuoto) dei marker/cue della registrazione.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkersList"
              example:
                markers:
                  - id: "mrk-1"
                    recording_id: "rec-a1b2c3"
                    elapsed_seconds: 90
                    elapsed_hms: "00:01:30"
                    absolute_time: "2026-08-04T10:01:30Z"
                    label: "Ingresso ospite"
                    type: "marker"
                    clip_status: "ready"
                    origin: "console"
                    origin_label: "Software di scaletta"
                    created_at: "2026-08-04T10:01:30.500000Z"
        "400":
          description: "`id` mancante/vuoto, o `type` fuori enum."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sotto-chiave mancante, malformata, inesistente o revocata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: Metodo diverso da GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /follow/sources.php:
    get:
      operationId: getFollowSources
      tags: [follow]
      summary: Elenco sorgenti
      description: >-
        Specchio di sola lettura del catalogo sorgenti pubblicato dal Pi.
        Whitelist in lettura applicata anche qui, difesa in profondità.
      security:
        - subkeyAuth: []
      responses:
        "200":
          description: Elenco sorgenti.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcesList"
              example:
                sources:
                  - id: "src-1"
                    name: "Ingresso 1"
                    media_type: "video"
                    active: true
        "401":
          description: Sotto-chiave mancante, malformata, inesistente o revocata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: Metodo diverso da GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /follow/schedules.php:
    get:
      operationId: getFollowSchedules
      tags: [follow]
      summary: Elenco orari programmati
      description: >-
        Specchio di sola lettura degli orari programmati pubblicato dal
        Pi. Whitelist in lettura applicata anche qui, difesa in
        profondità.
      security:
        - subkeyAuth: []
      responses:
        "200":
          description: Elenco orari programmati.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulesList"
              example:
                schedules:
                  - id: "sch-1"
                    source_id: "src-1"
                    source_name: "Ingresso 1"
                    label: "Prova serale"
                    on_calendar: "Mon..Fri 20:00"
                    slot_duration: 3600
                    active: true
        "401":
          description: Sotto-chiave mancante, malformata, inesistente o revocata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: Metodo diverso da GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    subkeyAuth:
      type: http
      scheme: bearer
      bearerFormat: sotto-chiave
      description: >-
        Sotto-chiave generata dal pannello di amministrazione per una
        console/sistema esterno specifico — mai il token di primo
        livello del Pi. Va inviata come `Authorization: Bearer
        <sotto-chiave>`. Ogni sotto-chiave ha uno scope fisso (`follow`
        o `follow+control`) assegnato alla creazione e revocabile
        singolarmente senza toccare le altre sotto-chiavi dello stesso
        Pi.
  schemas:
    FollowStatus:
      type: object
      description: >-
        Specchio di sola lettura dell'ultimo stato pubblicato dal Pi.
        `node_name`, `state` e `registrations` sono sempre presenti (lo
        stato è `"unknown"` e `registrations` è vuoto se il Pi non ha
        ancora pubblicato nulla). Gli altri campi in cima
        (`id`/`source`/`media_type`/`started_at`/`elapsed_seconds`/
        `marker_count`) sono un mirror di sola compatibilità della prima
        voce di `registrations`, mantenuto per chi ha integrato questo
        endpoint prima che esistesse il supporto multi-registrazione —
        vedi `registrations` per la lista completa e per scegliere il
        `target_id` di un comando.
      required: [node_name, state, registrations]
      properties:
        node_name:
          type: string
          nullable: true
          description: Nome del Pi assegnato alla creazione del tenant.
          example: "Pi di test"
        state:
          type: string
          description: >-
            Stato della prima registrazione attiva, così come riportato
            dal Pi (stringa libera, non un enum fisso), oppure
            `"unknown"` se nessuna registrazione è attiva. Mirror di
            compatibilità: vedi `registrations` per lo stato di ciascuna
            registrazione.
          example: "in registrazione"
        id:
          type: string
          description: >-
            Mirror di compatibilità dell'`id` della prima registrazione
            in `registrations`, se presente.
        source:
          type: string
          description: >-
            Mirror di compatibilità della `source` della prima
            registrazione in `registrations`, se presente.
          example: "ingresso-1"
        media_type:
          type: string
          description: Mirror di compatibilità, vedi `registrations`.
          example: "video"
        started_at:
          type: string
          description: Mirror di compatibilità, vedi `registrations`.
          example: "2026-08-04T10:00:00Z"
        elapsed_seconds:
          type: integer
          minimum: 0
          description: Mirror di compatibilità, vedi `registrations`.
          example: 42
        marker_count:
          type: integer
          minimum: 0
          description: Mirror di compatibilità, vedi `registrations`.
          example: 3
        registrations:
          type: array
          description: >-
            Tutte le registrazioni attualmente attive — Fluxus può
            registrare da più sorgenti insieme. Vuoto se nessuna
            registrazione è in corso.
          items:
            $ref: "#/components/schemas/Registration"
        received_at:
          type: string
          description: >-
            Timestamp con cui Connect ha ricevuto e salvato questo
            stato (non generato dal Pi). Assente se il Pi non ha ancora
            pubblicato nulla.
          example: "2026-08-04T10:00:42.000000Z"
    Registration:
      type: object
      description: >-
        Una singola registrazione attiva, così come pubblicata dal Pi.
        L'`id` è il valore da usare come `target_id` in
        `POST /control/commands.php` per indirizzare un comando a questa
        registrazione precisa.
      required: [id, state]
      properties:
        id:
          type: string
          description: >-
            Identificativo stabile della registrazione, assegnato dal
            Pi. Univoco fra le registrazioni pubblicate nello stesso
            momento.
          example: "rec-a1b2c3"
        state:
          type: string
          description: Stato di questa registrazione, riportato dal Pi (stringa libera).
          example: "in registrazione"
        source:
          type: string
          description: Sorgente di questa registrazione, così come riportata dal Pi.
          example: "ingresso-1"
        media_type:
          type: string
          example: "video"
        started_at:
          type: string
          description: Timestamp di inizio di questa registrazione, riportato dal Pi.
          example: "2026-08-04T10:00:00Z"
        elapsed_seconds:
          type: integer
          minimum: 0
          example: 42
        marker_count:
          type: integer
          minimum: 0
          example: 3
    CommandRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [marker, cue]
          description: >-
            Whitelist stretta: solo questi due valori sono accettati.
            Avvio/stop restano PENDING/FUTURO.
        label:
          type: string
          maxLength: 500
          description: >-
            Etichetta opzionale, ripulita dagli spazi iniziali/finali.
            Se vuota dopo il trim non viene salvata affatto.
          example: "Ingresso ospite"
        target_id:
          type: string
          description: >-
            L'`id` della registrazione (fra quelle elencate in
            `registrations` da `GET /follow/status.php`) a cui si
            applica questo comando. Obbligatorio se più di una
            registrazione è attiva; facoltativo con una sola
            registrazione attiva (assegnata automaticamente); ignorato
            se nessuna registrazione è attiva. Un valore che non
            corrisponde a una registrazione correntemente attiva viene
            rifiutato con 400 — whitelist stretta, come per `type`.
          example: "rec-a1b2c3"
    CommandAccepted:
      type: object
      required: [ok, id]
      properties:
        ok:
          type: boolean
          enum: [true]
        id:
          type: string
          description: Identificativo del comando in coda, assegnato da Connect.
          example: "20260804T210000.000000Z-a1b2c3d4"
    Recording:
      type: object
      description: Una registrazione dello storico, così come pubblicata dal Pi.
      required:
        - id
        - source_id
        - source_name
        - media_type
        - status
        - start_time
        - end_time
        - duration_seconds
        - marker_count
        - clip_count
      properties:
        id:
          type: string
          example: "rec-a1b2c3"
        source_id:
          type: string
          example: "src-1"
        source_name:
          type: string
          example: "Ingresso 1"
        media_type:
          type: string
          enum: [audio, video, clock]
          example: "video"
        status:
          type: string
          enum: [recording, completed, failed]
          example: "completed"
        start_time:
          type: string
          example: "2026-08-04T10:00:00Z"
        end_time:
          type: string
          example: "2026-08-04T10:42:00Z"
        duration_seconds:
          type: integer
          nullable: true
          minimum: 0
          example: 2520
        marker_count:
          type: integer
          minimum: 0
          example: 3
        clip_count:
          type: integer
          minimum: 0
          example: 1
    RecordingsList:
      type: object
      required: [recordings]
      properties:
        recordings:
          type: array
          items:
            $ref: "#/components/schemas/Recording"
    Marker:
      type: object
      description: Un marker/cue, così come pubblicato dal Pi.
      required:
        - id
        - recording_id
        - elapsed_seconds
        - elapsed_hms
        - absolute_time
        - label
        - type
        - clip_status
        - origin
        - origin_label
        - created_at
      properties:
        id:
          type: string
          example: "mrk-1"
        recording_id:
          type: string
          description: >-
            Id della registrazione a cui appartiene. Può non corrispondere
            a nessuna registrazione nota a questo tenant (innocuo).
          example: "rec-a1b2c3"
        elapsed_seconds:
          type: integer
          minimum: 0
          example: 90
        elapsed_hms:
          type: string
          example: "00:01:30"
        absolute_time:
          type: string
          description: ISO 8601 o formato del Pi, trattato come stringa opaca.
          example: "2026-08-04T10:01:30Z"
        label:
          type: string
          nullable: true
          example: "Ingresso ospite"
        type:
          type: string
          enum: [marker, cue]
          example: "marker"
        clip_status:
          type: string
          nullable: true
          example: "ready"
        origin:
          type: string
          nullable: true
          example: "console"
        origin_label:
          type: string
          nullable: true
          example: "Software di scaletta"
        created_at:
          type: string
          example: "2026-08-04T10:01:30.500000Z"
    MarkersList:
      type: object
      required: [markers]
      properties:
        markers:
          type: array
          items:
            $ref: "#/components/schemas/Marker"
    Source:
      type: object
      description: Una sorgente del catalogo, così come pubblicata dal Pi.
      required: [id, name, media_type, active]
      properties:
        id:
          type: string
          example: "src-1"
        name:
          type: string
          example: "Ingresso 1"
        media_type:
          type: string
          enum: [audio, video, clock]
          example: "video"
        active:
          type: boolean
          example: true
    SourcesList:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
    Schedule:
      type: object
      description: Un orario programmato, così come pubblicato dal Pi.
      required:
        - id
        - source_id
        - source_name
        - label
        - on_calendar
        - slot_duration
        - active
      properties:
        id:
          type: string
          example: "sch-1"
        source_id:
          type: string
          example: "src-1"
        source_name:
          type: string
          example: "Ingresso 1"
        label:
          type: string
          example: "Prova serale"
        on_calendar:
          type: string
          description: Espressione systemd OnCalendar, così come pubblicata dal Pi.
          example: "Mon..Fri 20:00"
        slot_duration:
          type: integer
          minimum: 0
          description: Durata dello slot, in secondi.
          example: 3600
        active:
          type: boolean
          example: true
    SchedulesList:
      type: object
      required: [schedules]
      properties:
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Messaggio d'errore in italiano, pensato per il log del chiamante.
