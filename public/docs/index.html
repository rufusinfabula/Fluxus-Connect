<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Fluxus Connect — API pubblica</title>
  <meta name="description" content="Documentazione dell'API pubblica di Fluxus Connect (Fase 4): lettura dello stato e deposito di comandi marker/cue.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="vendor/swagger-ui/favicon-32x32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="vendor/swagger-ui/favicon-16x16.png" sizes="16x16">
  <link rel="stylesheet" href="vendor/swagger-ui/swagger-ui.css">
  <style>
    body { margin: 0; background: #fafafa; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>

  <!-- Solo file statici locali (vendor/swagger-ui/), nessuna dipendenza da
       CDN o servizi esterni: coerente con l'installazione su hosting
       economici che potrebbero non avere sempre accesso alla rete
       pubblica, e con l'assenza di servizi aggiuntivi voluta per la
       Fase 5 (vedi docs/ROADMAP.md). -->
  <script src="vendor/swagger-ui/swagger-ui-bundle.js"></script>
  <script src="vendor/swagger-ui/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function () {
      window.ui = SwaggerUIBundle({
        url: 'openapi.yaml',
        dom_id: '#swagger-ui',
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset,
        ],
        layout: 'StandaloneLayout',
        deepLinking: true,
      });
    };
  </script>
</body>
</html>
